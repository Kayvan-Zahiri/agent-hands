<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-hands · what it is and what it did</title>
<style>
:root {
  --bg:#f5f7fa; --surface:#fff; --raised:#fafbfc; --line:#e4e8ee; --line-2:#ccd3dd;
  --ink:#151a21; --ink-2:#4c5666; --ink-3:#7a8494;
  --brand:#3552d4; --brand-2:#eaeefc;
  --ok:#0d7f57; --ok-2:#e6f5ee; --warn:#9c6410; --warn-2:#fdf2e0;
  --bad:#bd3a31; --bad-2:#fdeeec; --live:#2573c9; --live-2:#e8f1fb;
  --sh:0 1px 2px rgba(18,24,33,.05),0 4px 14px rgba(18,24,33,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1014; --surface:#15191f; --raised:#1a1f26; --line:#242a33; --line-2:#333b47;
  --ink:#e9edf3; --ink-2:#a8b2c0; --ink-3:#798394;
  --brand:#8299fa; --brand-2:#1a2237;
  --ok:#4cc68e; --ok-2:#11271e; --warn:#dba746; --warn-2:#281f12;
  --bad:#e97a6e; --bad-2:#2b1716; --live:#63aae9; --live-2:#112130;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}

/* chrome */
.top{height:58px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:14px}
.top h1{font-size:14.5px;font-weight:650;line-height:1.2}
.top h1 span{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3)}
.grow{flex:1}
.link{background:none;border:0;font:inherit;font-size:13px;color:var(--brand);cursor:pointer;
  padding:6px 10px;border-radius:7px}
.link:hover{background:var(--brand-2)}
.toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.toggle input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer}

/* layout */
.app{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;height:calc(100vh - 58px)}
.col{overflow-y:auto;padding:18px}
.col+.col{border-left:1px solid var(--line)}
aside,.rail{background:var(--surface)}
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:4px}
.sub{font-size:12px;color:var(--ink-3);margin-bottom:12px;line-height:1.45}

/* ask */
.askbox{position:relative;margin-bottom:8px}
.askbox svg{position:absolute;left:11px;top:13px;width:15px;height:15px;color:var(--ink-3)}
input{width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;transition:.12s}
#ask{padding-left:33px}
input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-2)}
input::placeholder{color:var(--ink-3)}

/* catalog */
.grp{margin-top:18px}
.grp h4{font-size:12px;font-weight:650;margin-bottom:1px}
.grp p{font-size:11.5px;color:var(--ink-3);margin-bottom:8px;line-height:1.4}
.item{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:9px;
  padding:9px 10px;cursor:pointer;display:block;margin-bottom:2px;transition:.12s}
.item:hover{background:var(--raised);border-color:var(--line)}
.item[aria-current=true]{background:var(--brand-2);border-color:var(--brand)}
.item .t{display:flex;align-items:center;gap:7px}
.item .n{font-weight:570;font-size:13.5px}
.item .d{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.item .id{display:none}
body.tech .item .id{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;
  font-family:ui-monospace,Menlo,monospace}
.tag{font-size:10px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;
  border-radius:5px;background:var(--bad-2);color:var(--bad);white-space:nowrap}
.tag.g{background:var(--raised);color:var(--ink-3);border:1px solid var(--line)}

/* main */
main{padding:28px 34px}
main>*{max-width:900px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--sh);padding:22px;margin-bottom:16px}
.card>h3{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px}
.card>h3+.hint{margin-bottom:14px}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.5}
h2{font-size:22px;font-weight:660;letter-spacing:-.02em;margin-bottom:5px}
.lede{color:var(--ink-2);font-size:14px;max-width:64ch}

/* explainer */
.hero{max-width:70ch}
.hero .kicker{font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  color:var(--brand);margin-bottom:9px}
.hero h2{font-size:27px;line-height:1.25;margin-bottom:11px}
.hero p{color:var(--ink-2);font-size:15px;margin-bottom:11px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;
  align-items:stretch;margin:6px 0 4px}
.beat{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:15px}
.beat .num{width:22px;height:22px;border-radius:6px;background:var(--brand);color:#fff;
  font-size:12px;font-weight:700;display:grid;place-items:center;margin-bottom:9px}
.beat h5{font-size:13.5px;font-weight:620;margin-bottom:5px}
.beat p{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.beat.no .num{background:var(--ink-3)}
.arrow{align-self:center;color:var(--ink-3);font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compare{border:1px solid var(--line);border-radius:10px;padding:15px}
.compare.bad{background:var(--bad-2);border-color:transparent}
.compare.good{background:var(--ok-2);border-color:transparent}
.compare h5{font-size:13px;font-weight:640;margin-bottom:8px}
.compare.bad h5{color:var(--bad)} .compare.good h5{color:var(--ok)}
.compare li{font-size:12.5px;color:var(--ink-2);list-style:none;padding-left:17px;
  position:relative;margin-bottom:5px;line-height:1.45}
.compare li::before{position:absolute;left:0;top:0}
.compare.bad li::before{content:"✕";color:var(--bad)}
.compare.good li::before{content:"✓";color:var(--ok)}

/* form */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field label{display:block;font-size:12.5px;font-weight:570;margin-bottom:4px}
.field .ty{display:none} body.tech .field .ty{display:inline;color:var(--ink-3);font-weight:400;margin-left:5px}
.field .why{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.4}
.warnbox{display:flex;gap:11px;padding:14px 16px;border-radius:9px;background:var(--warn-2);margin-top:18px}
.warnbox .i{color:var(--warn);font-size:15px;flex:none}
.warnbox p{font-size:13px;color:var(--ink-2);line-height:1.5}
.warnbox strong{color:var(--ink)}
.confirm{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13.5px;cursor:pointer}
.confirm input{width:16px;height:16px;accent-color:var(--brand)}
.go{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 20px;
  font:inherit;font-weight:600;cursor:pointer;margin-top:20px}
.go:hover{filter:brightness(1.08)} .go:disabled{opacity:.55;cursor:default}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}

/* verdict */
.verdict{display:flex;gap:14px;align-items:flex-start}
.vicon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.v-success .vicon{background:var(--ok-2);color:var(--ok)}
.v-business_outcome .vicon{background:var(--warn-2);color:var(--warn)}
.v-failure .vicon{background:var(--bad-2);color:var(--bad)}
.v-running .vicon{background:var(--live-2);color:var(--live)}
.verdict h4{font-size:16.5px;font-weight:640;margin-bottom:3px}
.verdict p{font-size:13.5px;color:var(--ink-2)}

/* outputs */
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.out{border:1px solid var(--line);border-radius:9px;padding:13px 15px;background:var(--raised)}
.out .k{font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.out .v{font-size:19px;font-weight:620;letter-spacing:-.01em;word-break:break-word}

/* steps */
.steps{position:relative;padding-left:24px}
.steps::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--line)}
.st{position:relative;padding:8px 0}
.st::before{content:"";position:absolute;left:-21px;top:15px;width:9px;height:9px;border-radius:50%;
  background:var(--line-2);border:2px solid var(--surface)}
.st.ok::before{background:var(--ok)} .st.no::before{background:var(--bad)}
.st .say{font-size:13.5px}
.st .meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.how{font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--ok-2);color:var(--ok)}
.how.weak{background:var(--warn-2);color:var(--warn)}
.tech{display:none} body.tech .tech{display:block}
body.tech .st .tech{display:inline}
.err{font-size:12.5px;color:var(--bad);margin-top:3px}

/* runs */
.run{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:9px;
  padding:9px 10px;cursor:pointer;display:block;margin-bottom:2px;transition:.12s}
.run:hover{background:var(--raised);border-color:var(--line)}
.run[aria-current=true]{background:var(--brand-2);border-color:var(--brand)}
.run .r1{display:flex;align-items:center;gap:8px}
.run .dot{width:7px;height:7px;border-radius:50%;flex:none}
.run .nm{font-weight:560;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run .r2{font-size:11.5px;color:var(--ink-3);margin-top:2px;padding-left:15px}
.d-success{background:var(--ok)} .d-business_outcome{background:var(--warn)}
.d-failure{background:var(--bad)} .d-running{background:var(--live)} .d-completed{background:var(--ink-3)}
.banner{padding:12px 15px;border-radius:9px;background:var(--bad-2);color:var(--bad);font-size:13px;margin-top:14px}
@media(max-width:1150px){.app{grid-template-columns:260px minmax(0,1fr)}.rail{display:none}}
@media(max-width:820px){.two{grid-template-columns:1fr}}
</style>

<header class="top">
  <div class="logo">◆</div>
  <h1>agent-hands<span>driving a legacy banking system, without an AI in the loop</span></h1>
  <div class="grow"></div>
  <button class="link" id="explain">What is this?</button>
  <label class="toggle"><input type="checkbox" id="tech"> Technical detail</label>
</header>

<div class="app">
  <aside class="col">
    <div class="eyebrow">Ask for something</div>
    <p class="sub">Type a request in plain words, or pick a job below.</p>
    <div class="askbox">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
        <circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 17 17" stroke-linecap="round"/></svg>
      <input id="ask" placeholder="check the balance for 103001" autocomplete="off">
    </div>
    <p class="hint" id="askhint">Matched on keywords, not by an AI — so you can see exactly
      why it picked what it picked.</p>
    <div id="catalog"></div>
  </aside>

  <main class="col" id="main"></main>

  <section class="col rail">
    <div class="eyebrow">Recent activity</div>
    <p class="sub">Every job this system has run, newest first.</p>
    <div id="runs"></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const j = (u,o) => fetch(u,o).then(r => r.json().then(b => ({status:r.status, body:b})));
let caps = [], chosen = null, current = null;

/* ---------------------------------------------------------------
   Plain English. The artifact speaks in the application's own
   vocabulary -- shares, operators, business outcomes -- which is
   correct for the file and useless for anyone meeting this cold.
   Everything a person reads is translated here, once.
----------------------------------------------------------------*/
const JOBS = {
  meridian_signon:         ['Sign in',              'Signs in to the banking system as a branch employee, the same way a person would.'],
  meridian_member_inquiry: ['Find a customer',      'Looks someone up by their account number or surname and opens their record.'],
  meridian_member_balance: ['Check a balance',      'Reads how much is in one of a customer’s accounts, and whether it is frozen.'],
  meridian_funds_transfer: ['Move money',           'Transfers an amount between two of a customer’s own accounts. Real, and cannot be undone.'],
  meridian_open_share:     ['Open an account',      'Opens an additional account for a customer with a starting deposit.'],
  meridian_update_member:  ['Update contact details','Changes a customer’s email, phone or mailing address.'],
  meridian_place_hold:     ['Freeze an account',    'Puts a hold on an account. Restricted — a teller is refused, a supervisor must do it.'],
};
// Two applications, and the difference matters to anyone reading this cold: one is
// the hosted system this was built to drive, the other is a local copy used to test
// the engine itself. Grouping them together would suggest a customer's money is in both.
const APPS = {
  live:     ['Meridian Core', 'The hosted credit-union system. No API — the screen is the only way in. These run against it for real.'],
  practice: ['Practice app', 'A local stand-in used to test the engine. Nothing here touches a real system.'],
};
const appOf = c => c.id.startsWith('meridian_') ? 'live' : 'practice';
const job = c => JOBS[c.id] ||
  [c.id.replace(/_/g, ' ').replace('@', ' — '), c.description || ''];

const PARAM = {
  operator:'the employee ID', password:'the password', branch:'the branch',
  member_id:'the customer number', share_id:'the account', value:'what to search for',
  search_by:'how to search', amount:'the amount', memo:'the memo',
  from_share:'the account to take money from', to_share:'the account to pay money into',
  share_type:'the type of account', deposit:'the opening deposit', reason:'the reason',
  notes:'the notes', email:'the email address', phone:'the phone number', address:'the address',
};
const OUT = {
  member_name:'Customer', balance:'Balance', status:'Account status',
  confirmation:'Confirmation number', savings_balance:'Savings balance', detail:'Detail',
};
const HOW = {
  role_name:            ['by its name on screen', 1],
  role_name_in_region:  ['by its name on screen', 1],
  labelled_field:       ['by the label next to it', 1],
  nth_of_role:          ['by counting boxes — fragile', 0],
  dom_path:             ['by the page’s structure — fragile', 0],
};

function saidStep(s) {
  const ctrl = s.resolved_by && /^(\w+) "(.*)"$/.exec(s.resolved_by.value || '');
  const named = ctrl ? `“${ctrl[2]}”` : 'a control';
  const p = (s.text || '').replace(/^\{(.+)\}$/, (_, n) => PARAM[n] || n);
  switch (s.action) {
    case 'navigate': return `Opened <b>${esc((s.url || '').replace(/^https?:\/\/[^/]+/, '') || 'the application')}</b>`;
    case 'type':     return `Entered ${esc(p)}`;
    case 'select':   return `Chose ${esc(p)}`;
    case 'click':    return `Clicked ${esc(named)}`;
    case 'read':     return `Read ${s.extra && s.extra.read ? `<b>${esc(s.extra.read)}</b>` : 'a value'} off the screen`;
    default:         return `Waited for the screen`;
  }
}

const VERDICT = {
  success:          ['✓', 'Done',                  'The job ran all the way through and every check passed.'],
  business_outcome: ['!',      'The system said no',    'Not a breakage — the application gave a real answer, and this is it.'],
  failure:          ['✕', 'Stopped',               'Something did not match what was recorded, so it stopped instead of guessing.'],
  running:          ['●', 'Running…',         'Driving the application in a real browser right now.'],
  completed:        ['●', 'Finished',              ''],
};

/* ---------------- the explainer ---------------- */
function explain() {
  chosen = null; current = null;
  document.querySelectorAll('.item,.run').forEach(el => el.setAttribute('aria-current','false'));
  $('#main').innerHTML = `
    <div class="hero">
      <div class="kicker">What this is</div>
      <h2>Some banking systems have no way in except the screen.</h2>
      <p>Credit unions run back-office software that predates the idea of an API. To check a
         balance or move money between a customer’s accounts, an employee signs in and clicks
         through pages built two decades ago. There is no other door.</p>
      <p>So if you want software to do that work, it has to use the screen too — like a person.
         That is easy to demo and hard to trust, because money is involved.</p>
    </div>

    <div class="card" style="margin-top:22px">
      <h3>The problem</h3>
      <p class="hint">Pointing an AI at the screen and letting it work things out fresh each time
        is the obvious approach. It is also the one you cannot put near a transfer.</p>
      <div class="two" style="margin-top:16px">
        <div class="compare bad">
          <h5>An AI decides every time</h5>
          <ul>
            <li>Does something slightly different on every run</li>
            <li>Nobody approved the steps, because there are no fixed steps</li>
            <li>Costs money and time on every single run</li>
            <li>When a screen changes it improvises — and clicks the wrong thing confidently</li>
          </ul>
        </div>
        <div class="compare good">
          <h5>Decide once, then repeat</h5>
          <ul>
            <li>Same steps every run, so the result is predictable</li>
            <li>A person reads and approves the steps before anything runs</li>
            <li>Free after the first time — no AI is involved</li>
            <li>When a screen changes it notices, and stops rather than guessing</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>How it works</h3>
      <p class="hint">Exploring and repeating are different problems, so they get different machinery.</p>
      <div class="flow" style="margin-top:16px">
        <div class="beat"><div class="num">1</div><h5>An AI explores, once</h5>
          <p>Given a goal, it clicks through the real application until the job is done — while
             somebody watches. This happens one time.</p></div>
        <div class="beat"><div class="num">2</div><h5>What it did is written down</h5>
          <p>Every step becomes a plain file a person can read: which control, in what order, and
             what has to be true afterwards. Nothing runs until someone approves it.</p></div>
        <div class="beat no"><div class="num">3</div><h5>It repeats, with no AI</h5>
          <p>That file is replayed as often as you like. No model is in the loop, so it behaves the
             same way every time and you can audit exactly what happened.</p></div>
      </div>
    </div>

    <div class="card">
      <h3>What you are looking at</h3>
      <p class="hint">This console is step 3. Ask for a job on the left, and it drives the real
        application in a real browser. Every run is recorded on the right — what it did, in order,
        what it read back, and whether anything looked different from the recording.</p>
      <p class="hint" style="margin-top:10px">Turn on <b>Technical detail</b> in the header to see
        the machinery underneath.</p>
    </div>`;
}

/* ---------------- catalog ---------------- */
async function loadCatalog() {
  const {body} = await j('/capabilities');
  caps = body.capabilities;
  const groups = {};
  for (const c of caps) (groups[appOf(c)] ||= []).push(c);
  const order = ['live', 'practice'];
  $('#catalog').innerHTML = order.filter(k => groups[k]).map(app => {
    const list = groups[app];
    const [nm, dsc] = APPS[app] || [app, ''];
    return `<div class="grp"><h4>${esc(nm)}</h4><p>${esc(dsc)}</p>
      ${list.map(c => { const [t, d] = job(c); return `
        <button class="item" data-id="${esc(c.id)}">
          <span class="t"><span class="n">${esc(t)}</span>
            ${c.irreversible ? '<span class="tag">moves money</span>' : ''}</span>
          <span class="d">${esc(d)}</span>
          <span class="id">${esc(c.id)}</span>
        </button>`}).join('')}</div>`;
  }).join('');
  $('#catalog').querySelectorAll('.item').forEach(el =>
    el.onclick = () => choose(caps.find(c => c.id === el.dataset.id)));
}

/* keyword routing -- deliberately not a model, so you can see why it chose */
const ROUTES = [[/balance|how much/i,'balance'],[/transfer|move|send|pay/i,'transfer'],
  [/hold|freeze|restrict/i,'hold'],[/open|new account|new share/i,'open_share'],
  [/update|change|e-?mail|phone|address/i,'update'],
  [/look ?up|find|search|who is/i,'inquiry'],[/sign ?in|sign ?on|log ?in/i,'signon']];
const route = t => { for (const [re,k] of ROUTES) if (re.test(t)) {
  const h = caps.find(c => c.id.includes(k)); if (h) return h; } return null; };

function guess(cap, text) {
  const o = {}, m = text.match(/\b\d{6}\b/), sh = text.match(/\b\d{6}-[A-Z0-9]+(?:-\d+)?\b/i),
        a = text.match(/\$?(\d+\.\d{2})\b/);
  for (const p of cap.params) {
    if ((p.name === 'member_id' || p.name === 'value') && m) o[p.name] = m[0];
    else if (p.name === 'amount' && a) o[p.name] = a[1];
    else if (p.name.endsWith('share') && sh) o[p.name] = sh[0];
    else if (p.example) o[p.name] = p.example;
  }
  return o;
}

$('#ask').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const cap = route(e.target.value);
  if (!cap) return $('#askhint').innerHTML =
    'No match. This matcher only knows a handful of words — pick a job from the list instead.';
  $('#askhint').innerHTML = `Matched <b>${esc(job(cap)[0])}</b> on a keyword.`;
  choose(cap, guess(cap, e.target.value));
});

/* ---------------- invoke ---------------- */
function choose(cap, prefill) {
  chosen = cap; current = null;
  document.querySelectorAll('.item').forEach(el => el.setAttribute('aria-current', el.dataset.id === cap.id));
  document.querySelectorAll('.run').forEach(el => el.setAttribute('aria-current','false'));
  const pre = prefill || guess(cap, $('#ask').value || '');
  const [title, desc] = job(cap);
  $('#main').innerHTML = `
    <h2>${esc(title)}</h2>
    <p class="lede">${esc(desc)}</p>
    <div class="card" style="margin-top:20px">
      <h3>What it needs to know</h3>
      <p class="hint">These come from the recording itself — the values a person had to type
        when this job was first worked out.</p>
      <div class="fields">
        ${cap.params.map(p => `<div class="field">
          <label>${esc(PARAM[p.name] || p.name)}<span class="ty">${p.name} · ${p.type}</span></label>
          <input data-p="${esc(p.name)}" value="${esc(pre[p.name] || '')}"
                 type="${p.name === 'password' ? 'password' : 'text'}"
                 placeholder="${esc(p.description || '')}">
          ${p.required ? '' : '<div class="why">Optional</div>'}
        </div>`).join('')}
      </div>
      ${cap.irreversible ? `<div class="warnbox"><span class="i">▲</span>
        <p><strong>This moves real money and cannot be undone.</strong> Ticking the box sends a
           confirmation tied to these exact values. Change any of them and the confirmation stops
           being valid, so it cannot be reused for a different amount.</p></div>
        <label class="confirm"><input type="checkbox" id="confirm">
          I have checked these values and want to go ahead</label>` : ''}
      <button class="go" id="go">Run it</button>
      <span class="hint" id="gonote" style="margin-left:12px"></span>
    </div>`;
  $('#go').onclick = invoke;
}

async function digest(args) {
  const buf = await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode(JSON.stringify(args, Object.keys(args).sort())));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

async function invoke() {
  const args = {};
  document.querySelectorAll('[data-p]').forEach(i => { if (i.value) args[i.dataset.p] = i.value; });
  const body = {args};
  if ($('#confirm')?.checked) body.confirm = {capability: chosen.id, args_digest: await digest(args)};
  const b = $('#go'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Running';
  $('#gonote').textContent = 'Opening a browser and driving the application…';
  const {body: res} = await j(`/capabilities/${encodeURIComponent(chosen.id)}/invocations`,
    {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  b.disabled = false; b.textContent = 'Run it'; $('#gonote').textContent = '';
  await loadRuns();
  if (res.run_id) show(res.run_id);
}

/* ---------------- runs ---------------- */
async function loadRuns() {
  const {body} = await j('/invocations');
  $('#runs').innerHTML = body.invocations.map(r => {
    const st = r.outcome || r.status, cap = caps.find(c => c.id === r.capability);
    return `<button class="run" data-run="${esc(r.run_id)}">
      <span class="r1"><span class="dot d-${st}"></span>
        <span class="nm">${esc(cap ? job(cap)[0] : r.capability)}</span></span>
      <span class="r2">${esc((VERDICT[st] || ['','',''])[1] || st)} ·
        ${r.run_id.slice(9,15).replace(/(\d\d)(\d\d)(\d\d)/,'$1:$2:$3')}</span></button>`;
  }).join('') || '<p class="hint">Nothing has run yet.</p>';
  $('#runs').querySelectorAll('.run').forEach(el => {
    el.setAttribute('aria-current', el.dataset.run === current);
    el.onclick = () => show(el.dataset.run);
  });
}

async function show(id) {
  current = id; chosen = null;
  document.querySelectorAll('.item').forEach(el => el.setAttribute('aria-current','false'));
  document.querySelectorAll('.run').forEach(el => el.setAttribute('aria-current', el.dataset.run === id));
  const [{body:r},{body:ev}] = await Promise.all([j(`/invocations/${id}`), j(`/invocations/${id}/events`)]);
  const res = r.result || {}, st = res.outcome || (r.error ? 'failure' : r.status);
  const cap = caps.find(c => c.id === r.capability);
  const [icon, head, why] = VERDICT[st] || ['●', st, ''];
  const steps = ev.events.filter(e => e.event === 'step');
  const outs = res.typed_outputs || res.outputs || {};

  $('#main').innerHTML = `
    <h2>${esc(cap ? job(cap)[0] : r.capability || '—')}</h2>
    <p class="lede">${esc(cap ? job(cap)[1] : '')}</p>
    <p class="hint mono" style="margin-top:6px;display:none" id="runid">${esc(id)}</p>

    <div class="card v-${st}" style="margin-top:20px">
      <div class="verdict"><div class="vicon">${icon}</div>
        <div><h4>${esc(head)}</h4>
          <p>${esc(st === 'business_outcome' && res.message ? res.message : why)}</p>
          ${st !== 'business_outcome' && res.message
            ? `<p class="hint tech" style="margin-top:5px">${esc(res.message)}</p>` : ''}
        </div></div>
      ${r.error ? `<div class="banner">${esc(r.error)}</div>` : ''}
    </div>

    ${Object.keys(outs).length ? `<div class="card"><h3>What it found</h3>
      <p class="hint">Read straight off the application’s screens.</p>
      <div class="outs">${Object.entries(outs).map(([k,v]) =>
        `<div class="out"><div class="k">${esc(OUT[k] || k.replace(/_/g,' '))}</div>
         <div class="v">${esc(v)}</div></div>`).join('')}</div></div>` : ''}

    ${(res.degraded || []).length ? `<div class="card"><h3>Worth a look</h3>
      <p class="hint">It finished, but some controls were not where the recording expected. That
        usually means the application has changed, and this job is close to breaking.</p>
      <div style="margin-top:12px">${res.degraded.map(d =>
        `<p class="hint" style="margin-bottom:5px">Step ${d.step}: expected to find it
         ${esc((HOW[d.primary]||[d.primary])[0])}, actually found it
         <b>${esc((HOW[d.won_by]||[d.won_by])[0])}</b>.</p>`).join('')}</div></div>` : ''}

    ${(res.recovered || []).length ? `<div class="card"><h3>Recovered from</h3>
      <p class="hint">Things that went wrong and were handled without stopping.</p>
      <div style="margin-top:10px">${res.recovered.map(l =>
        `<p class="hint" style="margin-bottom:5px">${esc(l)}</p>`).join('')}</div></div>` : ''}

    <div class="card"><h3>Exactly what it did</h3>
      <p class="hint">In order, on the real application. No AI was involved in any of these steps
        — they came from the recording.</p>
      ${steps.length ? `<div class="steps" style="margin-top:14px">${steps.map(s => {
        const h = s.resolved_by ? HOW[s.resolved_by.strategy] : null;
        return `<div class="st ${s.checkpoint_ok === true ? 'ok' : s.checkpoint_ok === false ? 'no' : ''}">
          <div class="say">${saidStep(s)}</div>
          <div class="meta">
            ${h ? `<span class="how${h[1] ? '' : ' weak'}">found ${esc(h[0])}</span>` : ''}
            <span class="tech">${s.duration_ms != null ? s.duration_ms + ' ms' : ''}
              ${s.resolved_by ? '· ' + esc(s.resolved_by.strategy) : ''}</span>
          </div>
          ${s.error ? `<div class="err">${esc(s.error)}</div>` : ''}
        </div>`}).join('')}</div>` : '<p class="hint">No steps were recorded.</p>'}
    </div>`;
  if ($('#tech').checked) $('#runid').style.display = 'block';
}

/* ---------------- chrome wiring ---------------- */
$('#tech').onchange = e => {
  document.body.classList.toggle('tech', e.target.checked);
  const el = $('#runid'); if (el) el.style.display = e.target.checked ? 'block' : 'none';
};
$('#explain').onclick = explain;

explain();
loadCatalog().then(loadRuns);
setInterval(() => { if (!chosen) loadRuns(); }, 5000);
</script>
