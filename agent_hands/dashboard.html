<!doctype html>
<meta charset="utf-8">
<title>Capability Console</title>
<style>
  body { background:#c8c8c8; margin:0; }
  body, td, th, input, button { font-family:Verdana,Arial,sans-serif; font-size:13px; color:#000; }
  a { color:#0000aa; }
  #page { width:1080px; margin:18px auto 40px; background:#fff; border:1px solid #003366; }
  #bar { background:#003366; padding:10px 14px; color:#fff; }

  #body { padding:16px 18px 24px; }
  h1 { font-size:19px; margin:0 0 12px; }
  h2 { font-size:12px; margin:20px 0 7px; color:#003366; border-bottom:1px solid #c9d4e2;
       padding-bottom:3px; }
  p { margin:0 0 9px; line-height:1.55; }
  .dim { color:#555; }
  .box { border:1px solid #003366; background:#eef2f7; padding:11px 13px; }
  table.grid { border-collapse:collapse; width:100%; }
  table.grid th { text-align:left; background:#eef2f7; color:#003366; font-size:11px;
    padding:4px 8px; border-bottom:1px solid #003366; white-space:nowrap; }
  table.grid td { padding:5px 8px; border-bottom:1px solid #e2e6ec; vertical-align:top; }
  tr.pick { cursor:pointer; } tr.pick:hover td { background:#eef2f7; }
  .lbl { font-weight:bold; }
  .err { color:#a00000; font-weight:bold; } .ok { color:#006600; font-weight:bold; }
  .warn { color:#8a5a00; font-weight:bold; }
  .fld { border:1px solid #7f9db9; background:#fff; padding:2px 3px; font-size:12px; width:100%; }
  .btn { font:inherit; font-size:14px; padding:5px 16px; }
  .req { color:#a00000; }
  .two { display:flex; gap:14px; }
  .two > div { flex:1; border:1px solid #003366; display:flex; flex-direction:column; }
  .two h3 { margin:0; background:#003366; color:#fff; font-size:13px; padding:8px 11px;
    letter-spacing:.04em; }
  .two .in { padding:12px 13px; flex:1; min-height:330px; font-size:14px; }
  .turn { border-top:1px solid #e2e6ec; padding:7px 0; }
  .turn:first-child { border-top:0; }
  .foot { border-top:1px solid #003366; background:#eef2f7; padding:9px 12px; font-size:14px; }
  .tag { font-size:10px; background:#eef2f7; border:1px solid #c9d4e2; padding:0 5px; color:#333; }
  .tag.w { background:#fdf3e2; border-color:#e0c68a; color:#8a5a00; }
  pre { background:#f7f8fa; border:1px solid #c9d4e2; padding:9px; overflow:auto;
        max-height:420px; font-family:Menlo,Consolas,monospace; font-size:11px; margin:0; }

  /* The service desk. Every selector below is scoped to #desk so nothing here
     can reach the reviewer tabs. */
  #desk { max-width:560px; margin:6px auto 0; }
  #desk h2 { border:0; padding:0; margin:0 0 3px; font-size:20px; color:#000; }
  #desk .sub { color:#555; margin:0 0 18px; }
  #desk .card { border:1px solid #003366; background:#fff; padding:20px 22px; }
  #desk label { display:block; margin:0 0 14px; }
  #desk label .cap { display:block; font-weight:bold; margin:0 0 4px; }
  #desk label .hint { display:block; color:#777; font-size:11px; margin:3px 0 0; }
  #desk input { width:100%; box-sizing:border-box; font:inherit; font-size:15px;
    padding:7px 8px; border:1px solid #7f9db9; background:#fff; }
  #desk input:focus { outline:2px solid #003366; outline-offset:-2px; }
  #desk .go { font:inherit; font-size:15px; font-weight:bold; padding:9px 22px;
    background:#003366; color:#fff; border:1px solid #003366; cursor:pointer; }
  #desk .go:disabled { background:#8c9bad; border-color:#8c9bad; cursor:default; }
  #desk .flat { font:inherit; font-size:14px; padding:9px 16px; background:none;
    border:1px solid #7f9db9; cursor:pointer; }
  #desk .acts { display:flex; gap:10px; align-items:center; margin-top:4px; }
  #desk .pick { display:block; width:100%; text-align:left; font:inherit; font-size:15px;
    padding:13px 15px; margin:0 0 8px; background:#fff; border:1px solid #c9d4e2; cursor:pointer; }
  #desk .pick:hover { border-color:#003366; background:#f4f7fb; }
  #desk .pick .w { float:right; font-size:11px; color:#8a5a00; }
  #desk .val { font-size:27px; font-weight:bold; margin:2px 0 0; }
  #desk .row { padding:11px 0; border-top:1px solid #e2e6ec; }
  #desk .row:first-of-type { border-top:0; }
  #desk .banner { padding:11px 14px; margin:0 0 16px; border-left:4px solid; }
  #desk .banner.ok   { border-color:#006600; background:#f0f7f0; }
  #desk .banner.said { border-color:#8a5a00; background:#fdf6e8; }
  #desk .banner.bad  { border-color:#a00000; background:#faf0f0; }
  #desk .banner.wait { border-color:#003366; background:#eef2f7; }
  #desk .banner b { display:block; margin:0 0 3px; }
  #desk .sign { border-top:1px solid #e2e6ec; margin-top:6px; padding-top:12px; }
  #desk .sign summary { cursor:pointer; color:#555; font-size:12px; }
  #ask { max-width:620px; margin:6px auto 0; }
  #ask h2 { border:0; padding:0; margin:0 0 3px; font-size:20px; color:#000; }
  #ask .sub { color:#555; margin:0 0 14px; }
  #ask .tape { border:1px solid #003366; background:#fff; padding:14px 16px;
    min-height:300px; max-height:52vh; overflow:auto; }
  #ask .t { margin:0 0 13px; }
  #ask .t .who { display:inline-block; width:44px; color:#777; font-size:11px;
    vertical-align:top; text-transform:uppercase; letter-spacing:.05em; }
  #ask .t .said { display:inline-block; width:calc(100% - 52px); }
  #ask .t.you .said { font-weight:bold; }
  #ask .t.run .said { font-family:Menlo,Consolas,monospace; font-size:12px; color:#555; }
  #ask .box { border:1px solid #c9d4e2; background:#f7f9fc; padding:9px 12px; margin:2px 0 0; }
  #ask .box .k { color:#777; font-size:11px; }
  #ask .chips { margin:10px 0 0; }
  #ask .chip { font:inherit; font-size:13px; padding:5px 11px; margin:0 6px 6px 0;
    background:#eef2f7; border:1px solid #7f9db9; cursor:pointer; }
  #ask .chip:hover { background:#003366; color:#fff; }
  #ask .chip.go { background:#003366; color:#fff; font-weight:bold; }
  #ask .say { display:flex; gap:8px; margin:12px 0 0; }
  #ask .say input { flex:1; font:inherit; font-size:15px; padding:8px 9px;
    border:1px solid #7f9db9; }
  #ask .say button { font:inherit; font-size:15px; padding:8px 18px;
    background:#003366; color:#fff; border:1px solid #003366; cursor:pointer; }
  #ask .starters { margin:14px 0 0; }
  #ask .starters .k { color:#777; font-size:11px; display:block; margin:0 0 6px; }
  #desk .live { font-family:Menlo,Consolas,monospace; font-size:12px; color:#333;
    background:#f7f8fa; border:1px solid #e2e6ec; padding:10px 12px; margin-top:14px;
    max-height:190px; overflow:auto; }
</style>

<div id="page">
  <div id="bar">
    <b>CAPABILITY CONSOLE</b><span>&nbsp;&nbsp;agent-hands &nbsp; v1.0</span>
    <span class="r" id="conn">connecting</span>
  </div>
  <div id="tabs">
    <button data-tab="about" aria-current="true">Overview</button>
    <button data-tab="jobs">Jobs</button>
    <button data-tab="operator">Operator</button>
    <button data-tab="artifact">Artifact</button>
    <button data-tab="runs">Runs</button>
    <button data-tab="service">Service Desk</button>
    <button data-tab="ask">Ask</button>
  </div>
  <div id="body"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const j = (u, o) => fetch(u, o).then(r => r.json());
let caps = [], chosen = null;

const NAMES = {
  signon:'Sign in', inquiry:'Find a customer', balance:'Check a balance',
  transfer:'Move money', open_share:'Open an account', update:'Update contact details',
  hold:'Freeze an account',
};
function title(c) {
  for (const k in NAMES) if (c.id.includes(k)) return NAMES[k];
  return c.id.replace(/_/g, ' ');
}
const FIELD = { operator:'Operator ID', password:'Password', branch:'Branch',
  member_id:'Member No.', share_id:'Account', value:'Search value', search_by:'Search by',
  amount:'Amount', memo:'Memo', from_share:'From account', to_share:'To account',
  share_type:'Account type', deposit:'Opening deposit', reason:'Reason code', notes:'Notes',
  email:'E-mail', phone:'Phone', address:'Mailing address' };
const OUT = { member_name:'Name', balance:'Balance', savings_balance:'Balance', status:'Status',
  confirmation:'Confirmation', confirmation_number:'Confirmation', new_share_id:'New account' };
const VERDICT = { success:['ok','COMPLETED'], business_outcome:['warn','THE SYSTEM ANSWERED'],
  failure:['err','STOPPED'], running:['dim','RUNNING'], completed:['dim','FINISHED'] };
const HOW = { role_name:['by its name on screen',1], role_name_in_region:['by its name on screen',1],
  labeled_field:['by the label beside it',1], nth_of_role:['by counting — fragile',0],
  dom_path:['by page structure — fragile',0] };

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
function go(tab) {
  document.querySelectorAll('#tabs button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.tab === tab));
  ({about, jobs, operator, artifact, runs, service, ask})[tab]();
}

/* ------------------------------ how it works ------------------------------ */
let picked = null, produced = null;

// The goal the model gets is the recorded description with its example values
// put back, which is as close as we can get to the sentence somebody typed the
// first time this was worked out.
function goalFor(cap) {
  let g = cap.description || '';
  cap.params.forEach(p => { if (p.example) g = g.replaceAll('{' + p.name + '}', p.example); });
  return g.replace(/\{(\w+)\}/g, '$1');
}
function argsFor(cap) {
  const a = {};
  cap.params.forEach(p => { a[p.name] = p.example || (p.name === 'password' ? 'password' : ''); });
  return a;
}

function about() {
  if (!picked) picked = caps.find(c => c.id === 'meridian_balance_recorded') || caps[0];
  $('#body').innerHTML = `
    <h1>${esc(title(picked))} &mdash; the same job, twice</h1>
    <div class="two">
      <div><h3>ONCE &mdash; WITH AN AI</h3>
        <div class="in" id="lhs"><p class="dim">A model works it out by clicking
          through the real screen.</p></div>
        <div class="foot"><button class="btn" id="rec">Run with the AI</button>
          <span id="recfoot" class="dim"></span></div></div>
      <div><h3>EVERY TIME SINCE &mdash; NO AI</h3>
        <div class="in" id="rhs"><p class="dim">The engine repeats what it wrote.</p></div>
        <div class="foot"><button class="btn" id="rep">Run the recording</button>
          <span id="repfoot" class="dim"></span></div></div>
    </div>`;
  $('#rec').onclick = runAI;
  $('#rep').onclick = runEngine;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function runAI() {
  $('#rec').disabled = true;
  $('#lhs').innerHTML = '<p class="dim">The model is looking at the screen…</p>';
  $('#recfoot').innerHTML = ' <b class="warn">thinking</b>';
  const t0 = Date.now();
  // Do not block: come back with a run id and watch the log fill in, because a
  // panel that sits still for thirty seconds does not look like anything.
  produced = 'live_' + picked.id.replace(/_recorded$/, '');
  const started = await j('/recordings', { method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ goal: goalFor(picked), name: produced, wait_seconds: 0 }) });
  let r = started, first = true;
  const seen = new Set();
  while (r.status !== 'completed') {
    await sleep(600);
    const ev = await j(`/invocations/${started.run_id}/events`);
    for (const e of ev.events.filter(x => x.event === 'discovery_action')) {
      const key = e.elapsed_ms + ':' + e.action;
      if (seen.has(key)) continue;
      seen.add(key);
      if (first) { $('#lhs').innerHTML = ''; first = false; }
      $('#lhs').insertAdjacentHTML('beforeend',
        `<div class="turn">${esc(short(e.detail))}</div>`);
      $('#recfoot').innerHTML = ` <b class="warn">thinking</b> &middot; ` +
        `${seen.size} action${seen.size === 1 ? '' : 's'} &middot; ` +
        `${((Date.now()-t0)/1000).toFixed(0)}s`;
    }
    r = await j(`/invocations/${started.run_id}`);
  }
  $('#rec').disabled = false;
  const secs = ((Date.now() - t0) / 1000).toFixed(0);
  if (r.error) { $('#lhs').innerHTML = `<p class="err">${esc(r.error)}</p>`;
                 $('#recfoot').textContent = ''; return; }
  $('#recfoot').innerHTML = ` <b>${r.result.turns} model turns</b> &middot; ${secs}s`;
  caps = (await j('/capabilities')).capabilities;
}

async function digest(a) {
  const b = await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode(JSON.stringify(a, Object.keys(a).sort())));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

async function runEngine() {
  // Whatever the AI just wrote, if it wrote one; otherwise the capability that
  // was already on file for this job.
  const cap = caps.find(c => c.id === produced) || picked;
  if (!cap) { $('#rhs').innerHTML = '<p class="dim">Nothing to replay yet.</p>'; return; }
  $('#rep').disabled = true;
  $('#rhs').innerHTML = '<p class="dim">Watch the browser window…</p>';
  const t0 = Date.now();
  const args = argsFor(cap);
  const body = { args };
  // A write needs the caller to say so, tied to these exact values.
  if (cap.irreversible) body.confirm = { capability: cap.id, args_digest: await digest(args) };
  const r = await j(`/capabilities/${encodeURIComponent(cap.id)}/invocations`,
    { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  $('#rep').disabled = false;
  const ev = await j(`/invocations/${r.run_id}/events`);
  const steps = ev.events.filter(e => e.event === 'step');
  const ms = (ev.events[ev.events.length - 1] || {}).elapsed_ms;
  const res = r.result || {};
  $('#rhs').innerHTML = steps.length
    ? steps.map(st => `<div class="turn">${esc(said(st))}</div>`).join('')
    : `<p class="err">${esc(res.message || r.error || 'refused')}</p>`;
  $('#repfoot').innerHTML = ` <b>0 model turns</b> &middot; ${(ms/1000).toFixed(2)}s`;
}

function stepLine(st) {
  const t = st.target && st.target.candidates[0];
  const named = t && /^\w+ "(.*)"$/.exec(t.value);
  return st.action === 'navigate' ? 'opened the sign-on screen'
    : st.action === 'type' ? `typed ${(st.text||'').replace(/[{}]/g,'')}`
    : st.action === 'select' ? `chose ${(st.text||'').replace(/[{}]/g,'')}`
    : st.action === 'click' ? `clicked ${named ? named[1] : 'a control'}`
    : st.action === 'read' ? `read ${st.extracts || 'a value'}` : st.action;
}

/* -------------------------------- run a job ------------------------------- */
function jobs() {
  const seen = {};
  for (const c of caps.filter(x => x.id.startsWith('meridian_')))
    if (!seen[title(c)] || c.id.endsWith('_recorded')) seen[title(c)] = c;
  const live = Object.values(seen);
  $('#body').innerHTML = `
    <h1>Pick a job</h1>
    <table class="grid"><tr><th>Job</th><th>Capability</th><th>Writes</th></tr>
    ${live.map(c => `<tr class="pick" data-id="${esc(c.id)}">
      <td class="lbl">${esc(title(c))}</td><td class="dim">${esc(c.id)}</td>
      <td>${c.irreversible ? '<span class="err">yes</span>' : 'no'}</td></tr>`).join('')}</table>`;
  $('#body').querySelectorAll('tr.pick').forEach(tr => tr.onclick = () => {
    picked = caps.find(c => c.id === tr.dataset.id);
    produced = null;
    go('about');
  });
}

/* -------------------------- somebody is watching -------------------------- */
/* The same replay the Overview runs, with one thing withheld: the confirmation
   that says a write was meant. The run reaches the step that writes, stops, and
   asks. Nothing on this page changes how any other run behaves -- `operator` is
   sent per invocation, so a run that does not ask still gives up on its own. */
const DEADLINE = 180;             // matches QueueConsole's, so the page can say so
// `following` is what stops a second poller: every visit to this tab re-runs
// operator(), and without it each visit started another loop on the same run.
// `opRun` is cleared the moment a run settles, because the panel belongs to the
// job in the heading, and the heading can change while you are away.
let opRun = null, parked = null, opStart = 0, following = false, answered = false;

function operator() {
  const cap = watchable();
  $('#body').innerHTML = `
    <h1>${esc(cap ? title(cap) : 'Nothing that writes')} &mdash; with somebody watching</h1>
    <div class="two"><div style="flex:none;width:100%">
      <h3>THE RUN</h3>
      <div class="in" id="ops"><p class="dim">The engine drives until it reaches
        the step that writes, then stops and asks.</p></div>
      <div class="foot"><button class="btn" id="go"${cap ? '' : ' disabled'}>Start</button>
        <span id="opfoot" class="dim"></span></div></div></div>`;
  if (cap) $('#go').onclick = () => runWatched(cap);
  // A run left parked while you were on another tab is still parked, and the
  // browser is still sitting on its screen. Pick that one back up rather than
  // offering a second Start, which would leave the first waiting on nobody.
  if (opRun) { $('#go').disabled = true; follow(opRun); }
}

/* Only a job with a write has a step worth stopping at. */
function watchable() {
  if (picked && picked.irreversible) return picked;
  return caps.find(c => c.id === 'meridian_transfer_recorded')
      || caps.find(c => c.id.startsWith('meridian_') && c.irreversible) || null;
}

async function runWatched(cap) {
  $('#go').disabled = true;
  parked = null;
  answered = false;
  opStart = Date.now();
  $('#ops').innerHTML = '<p class="dim">Watch the browser window…</p>';
  // No `confirm`, so the write is not pre-authorized. `operator` is the run
  // asking to be parked on a person rather than abandoned.
  const started = await j(`/capabilities/${encodeURIComponent(cap.id)}/invocations`,
    { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ args: argsFor(cap), wait_seconds: 0, operator: true }) });
  opRun = started.run_id;
  follow(opRun);
}

/* One poller per run, however many times the tab is opened. */
async function follow(runId) {
  if (following) return;
  following = true;
  try {
    const r = await watch(runId);
    if (r) await settled(runId, r);
  } finally {
    following = false;
  }
}

async function settled(runId, r) {
  const ev = await j(`/invocations/${runId}/events`);
  const steps = ev.events.filter(e => e.event === 'step');
  const res = r.result || {};
  const v = VERDICT[res.outcome] || ['dim', res.outcome || 'stopped'];
  const note = parked
    ? (res.outcome === 'success' ? ' &mdash; parked once, a person said yes'
                                 : ' &mdash; parked once, and nothing was written')
    : '';
  const secs = ((Date.now() - opStart) / 1000).toFixed(1);
  // Done with this run before painting: a later visit to the tab must not
  // repaint it, because by then the heading may name a different job.
  opRun = null;
  if (!$('#ops')) return;
  $('#go').disabled = false;
  $('#ops').innerHTML =
    `<div class="box"><span class="${v[0]}">${v[1]}</span>${note}` +
    (res.message ? `<br><span class="dim">${esc(res.message)}</span>` : '') +
    (r.error ? `<br><span class="err">${esc(r.error)}</span>` : '') +
    (Object.entries(res.outputs || {}).map(([k, val]) =>
      `<br>${esc(OUT[k] || k)}: <b>${esc(val)}</b>`).join('')) + '</div>' +
    steps.map(st => `<div class="turn">${esc(said(st))}</div>`).join('');
  $('#opfoot').innerHTML = ` <b>0 model turns</b> &middot; ${secs}s`;
}

/* A run can stop and ask for a person. Poll it, show the packet when it does,
   and let whoever is watching answer -- the browser is still sitting on the
   screen it stopped at, which is the whole reason to stop rather than fail. */
async function watch(runId) {
  for (;;) {
    await sleep(700);
    if (opRun !== runId) return null;
    const run = await j(`/invocations/${runId}`).catch(() => null);
    if (!run) continue;
    if (run.status === 'completed') return run;
    if (!$('#ops')) continue;
    if (run.status === 'awaiting_operator' && run.pending) { packet(runId, run.pending); continue; }
    // Running, and it has been answered: the engine is doing the step you just
    // authorized. That is a few seconds of a browser clicking, and a panel
    // reading "resume…" through it is the one moment the demo goes blank.
    if (answered) await progress(runId);
  }
}

async function progress(runId) {
  const ev = await j(`/invocations/${runId}/events`).catch(() => null);
  if (!ev || !$('#ops')) return;
  const steps = ev.events.filter(e => e.event === 'step');
  $('#ops').innerHTML = `<div class="box"><span class="warn">WORKING</span>
    <span class="dim">&mdash; the engine is doing the step you authorized</span></div>` +
    steps.map(st => `<div class="turn">${esc(said(st))}</div>`).join('');
}

/* Drawn once so a click cannot land on a button that is being replaced; only
   the clock is rewritten after that. */
function packet(runId, p) {
  parked = p;
  if (!$('#ok')) {
    $('#ops').innerHTML = `<div class="box">
      <span class="err">NEEDS A PERSON</span> &mdash; ${esc(p.reason || '')}<br><br>
      ${esc(p.question || '')}<br><br>
      <span class="dim">The browser is still on the screen it stopped at.
        Nothing has been written.<br>
        Answer here. Clicking in the browser window does not reach the run, and
        doing the step by hand means resume is refused &mdash; otherwise the
        engine would do it a second time. Closing the window ends the run.
        </span><br><br>
      <button class="btn" id="ok">Resume</button>
      <button class="btn" id="no">Abort</button>
      &nbsp;<span class="dim" id="left"></span></div>`;
    const answer = d => { answered = true;
      $('#ops').innerHTML = `<p class="dim">${d}…</p>`;
      j(`/invocations/${runId}/decision`, { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ decision: d, note: 'answered in the console' }) }); };
    $('#ok').onclick = () => answer('resume');
    $('#no').onclick = () => answer('abort');
  }
  // Both clocks are this machine's, so raised_at is directly comparable.
  const left = Math.max(0, Math.round(p.raised_at + DEADLINE - Date.now() / 1000));
  if ($('#left')) $('#left').textContent =
    left ? `gives up on its own in ${left}s` : 'giving up…';
}

/* ---------------------------------- ask ---------------------------------- */
/* The same jobs, asked for in a sentence instead of picked off a list.
   Everything offered as a chip is real input: clicking one sends exactly the
   text on it, and the turn resolves the same way as if it had been typed. The
   point of the chips is that a demo should not depend on typing accurately in
   front of people, not that the conversation is staged.

   Nothing here decides anything. `POST /chat` resolves a sentence to a
   capability and arguments and runs nothing; this page then takes that plan to
   the ordinary invocation route, through the same gates as every other caller.

   Its own state and its own ids, so the tabs above are untouched. */
let askState = null, askBusy = false, askStarters = [];

function ask() {
  $('#body').innerHTML = `<div id="ask">
    <h2>Ask for it</h2>
    <p class="sub">Say what you need. It works out which job that is, asks for
      anything missing, and reads the answer back.</p>
    <div class="tape" id="tape"><div class="t"><span class="who">bot</span
      ><span class="said">What do you need?</span></div></div>
    <div class="chips" id="chips"></div>
    <div class="say">
      <input id="saybox" placeholder="type it, or click one below"
        autocomplete="off">
      <button id="saygo">Send</button>
    </div>
    <div class="starters" id="starters"></div>
  </div>`;
  $('#saygo').onclick = () => askSay($('#saybox').value);
  $('#saybox').onkeydown = e => { if (e.key === 'Enter') askSay($('#saybox').value); };
  askShowStarters();
}

async function askShowStarters() {
  if (!askStarters.length)
    askStarters = (await j('/chat/starters').catch(() => ({}))).starters || [];
  if (!$('#starters')) return;
  $('#starters').innerHTML = `<span class="k">Try one</span>` +
    askStarters.map(t => `<button class="chip">${esc(t)}</button>`).join('');
  $('#starters').querySelectorAll('.chip').forEach(
    b => b.onclick = () => askSay(b.textContent));
}

function askLine(who, said, cls) {
  if (!$('#tape')) return;
  $('#tape').insertAdjacentHTML('beforeend',
    `<div class="t ${cls || who}"><span class="who">${esc(who)}</span
      ><span class="said">${said}</span></div>`);
  $('#tape').scrollTop = $('#tape').scrollHeight;
}

function askChips(list, go) {
  if (!$('#chips')) return;
  $('#chips').innerHTML = (list || []).map(
    t => `<button class="chip${go && t === 'yes' ? ' go' : ''}">${esc(t)}</button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(
    b => b.onclick = () => askSay(b.textContent));
}

async function askSay(text) {
  text = (text || '').trim();
  if (!text || askBusy) return;
  askBusy = true;
  if ($('#saybox')) $('#saybox').value = '';
  askChips([]);
  askLine('you', esc(text));

  let r;
  try {
    r = await j('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                           body: JSON.stringify({ message: text, state: askState }) });
  } catch (e) { askBusy = false; return askLine('bot', 'I could not reach the service.'); }
  if (r.error) { askBusy = false; return askLine('bot', esc(r.error)); }
  askState = r.state;

  if (r.action === 'puzzled' || r.action === 'ask') {
    askLine('bot', esc(r.message));
    askChips(r.chips);
    askBusy = false;
    return;
  }
  if (r.action === 'confirm') {
    const shown = Object.entries(r.args).filter(([k]) =>
      !['operator', 'password', 'branch'].includes(k));
    askLine('bot', `Before I do it &mdash; this changes records and cannot be undone.
      <div class="box">${shown.map(([k, v]) =>
        `<span class="k">${esc(DESK_CAP[k] || k.replace(/_/g, ' '))}</span> <b>${esc(v)}</b>`
      ).join('<br>')}</div>`);
    askChips(['yes', 'no'], true);
    askBusy = false;
    return;
  }
  await askRun(r.capability, r.args);
  askBusy = false;
}

/* The plan goes to the ordinary invocation route. Same gates, same evidence. */
async function askRun(capId, args) {
  const cap = caps.find(c => c.id === capId);
  askLine('bot', 'Working&hellip;');
  const body = { args, wait_seconds: 0, operator: true };
  if (cap && cap.irreversible)
    body.confirm = { capability: capId, args_digest: await digest(args) };
  let started;
  try {
    started = await j(`/capabilities/${encodeURIComponent(capId)}/invocations`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body) });
  } catch (e) { return askLine('bot', 'I could not start that.'); }
  if (started.error) return askLine('bot', esc(started.error));

  // Three reads in a row all say "Reading the answer", which is true and says
  // nothing. One line per thing that changed.
  const seen = new Set();
  let lastLine = '';
  for (;;) {
    await sleep(700);
    if (!$('#tape')) return;
    const run = await j(`/invocations/${started.run_id}`).catch(() => null);
    if (!run) continue;
    if (run.status === 'awaiting_operator' && run.pending) {
      askLine('bot', `<b>${esc(DESK_WHY[run.pending.reason] || DESK_WHY._)}</b>
        Nothing has been changed yet.`);
      askChips(['approve', 'cancel'], true);
      askAwait(started.run_id);
      return;
    }
    const ev = await j(`/invocations/${started.run_id}/events`).catch(() => null);
    if (ev) for (const e of ev.events.filter(x => x.event === 'step')) {
      const line = deskLine(e);
      if (!line || seen.has(e.index)) continue;
      seen.add(e.index);
      if (line === lastLine) continue;
      lastLine = line;
      askLine('', esc(line), 'run');
    }
    if (run.status === 'completed') return askDone(run);
  }
}

function askAwait(runId) {
  askChips([]);
  $('#chips').innerHTML =
    `<button class="chip go">Approve</button><button class="chip">Cancel</button>`;
  const bs = $('#chips').querySelectorAll('.chip');
  const answer = d => {
    askChips([]);
    askLine('you', d === 'resume' ? 'approve' : 'cancel');
    j(`/invocations/${runId}/decision`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ decision: d, note: 'answered in the chat' }) })
      .then(() => askFollow(runId));
  };
  bs[0].onclick = () => answer('resume');
  bs[1].onclick = () => answer('abort');
}

async function askFollow(runId) {
  for (;;) {
    await sleep(700);
    if (!$('#tape')) return;
    const run = await j(`/invocations/${runId}`).catch(() => null);
    if (run && run.status === 'completed') return askDone(run);
  }
}

/* The three endings, kept apart. */
function askDone(run) {
  const res = run.result || {};
  const outs = Object.entries(res.outputs || {});
  if (res.outcome === 'success') {
    askLine('bot', outs.length
      ? `Done.<div class="box">${outs.map(([k, v]) =>
          `<span class="k">${esc(OUT[k] || k.replace(/_/g, ' '))}</span> <b>${esc(v)}</b>`
        ).join('<br>')}</div>`
      : 'Done. MERIDIAN accepted it.');
  } else if (res.outcome === 'business_outcome') {
    askLine('bot', `MERIDIAN says: <b>${esc(res.message || 'the request was declined')}</b>.
      That is its answer, not a fault, and nothing was changed.`);
  } else {
    const signon = /OPERATOR SIGN ON|NOT SIGNED ON/i.test(res.observed || '');
    askLine('bot', signon
      ? 'Those sign-on details were not accepted. Nothing was changed.'
      : `I could not finish that, and nothing was changed.
         <span class="dim">${esc(res.message || run.error || '')}</span>`);
  }
  askShowStarters();
}

/* ------------------------------ service desk ------------------------------ */
/* The end-user surface. Somebody picks a job, fills in a form built from the
   capability's declared parameters, and reads the answer.

   Nothing here says replay, target, strategy, frame or artifact, because none
   of that is the person's problem. It also does not show the parameter
   `description` fields, which are recorder notes ("used in step[6].text") and
   would leak the machinery straight into the form.

   Kept to its own state and its own DOM ids. It reads the shared helpers and
   writes none of them, so the reviewer tabs above behave exactly as before. */

const DESK_SIGNON = new Set(['operator', 'password', 'branch']);

/* A caption for every parameter the seven jobs declare. FIELD is not extended,
   because `said()` reads it and that would change what the Operator tab prints. */
const DESK_CAP = Object.assign({}, FIELD, {
  transfer: 'Amount', address_id: 'Address line', deposit: 'Opening deposit',
  share_type: 'Account type', member_id: 'Member number', share_id: 'Share / account',
});
const DESK_HINT = {
  member_id: 'the number on the member’s card', share_id: 'e.g. 103001-MMKT-3',
  transfer: 'in dollars', deposit: 'in dollars', reason: 'e.g. LEGAL',
  from_share: 'the account the money leaves', to_share: 'the account the money lands in',
};
/* What the button says, and what the answer screen is called. */
const DESK_VERB = {
  balance: ['Check balance', 'Balance'], inquiry: ['Find customer', 'Customer'],
  signon: ['Sign in', 'Signed in'], transfer: ['Move money', 'Transfer'],
  open_share: ['Open account', 'New account'], update: ['Save changes', 'Updated'],
  hold: ['Freeze account', 'Hold'],
};
function deskVerb(cap, i) {
  for (const k in DESK_VERB) if (cap.id.includes(k)) return DESK_VERB[k][i];
  return i ? 'Result' : 'Run';
}

/* Why a run stopped, said to the person who asked for it. The engine's own
   wording -- "step 11 was declined by the approver" -- is for the run log. */
const DESK_WHY = {
  approval_required: 'Someone has to approve this before it goes through.',
  unresolved_element: 'MERIDIAN is not showing what we expected.',
  checkpoint_failed: 'MERIDIAN is not showing what we expected.',
  unexpected_state: 'MERIDIAN showed a screen we did not expect.',
  authentication_required: 'MERIDIAN is asking to sign in again.',
  attempt_limit: 'This is not going through.',
  _: 'This needs a person to look at it.',
};

/* Filled in so the form can be walked through by clicking. Only for the
   parameters no artifact carries an example for -- everything else is seeded
   from the capability itself. Every value here has been run against the live
   target. The password is the demo operator's, the same one README, RUN.md and
   every replay command in the repo already print in the clear. */
const DESK_DEMO = {
  password: 'password',
  from_share: '103001-MMKT-3', to_share: '103001-S0070-7',
  share_id: '103001-MMKT-3',
  email: 'd.vaughan@example.test', phone: '555-0199', address: '14 Bay Street',
  notes: 'demo', memo: 'demo',
};

let deskCap = null, deskRun = null, deskBusy = false;

function service() {
  $('#body').innerHTML = '<div id="desk"></div>';
  deskCap ? deskForm() : deskPick();
}

/* 1. choose a job */
function deskPick() {
  // Where two artifacts do the same job, take the one that knows what the
  // application's refusal screens mean. Without business rules a "you are not
  // authorized" comes back as a broken automation, which is the one thing an
  // end-user surface must not do. The Jobs tab still prefers the recorded one;
  // it is showing what a model produced, which is a different question.
  const seen = {};
  for (const c of caps.filter(x => x.id.startsWith('meridian_'))) {
    const rules = (c.business_codes || []).length;
    const held = seen[title(c)];
    if (!held || rules > (held.business_codes || []).length) seen[title(c)] = c;
  }
  $('#desk').innerHTML = `<h2>What do you need to do?</h2>
    <p class="sub">Pick a task.</p>
    ${Object.values(seen).map(c => `<button class="pick" data-id="${esc(c.id)}">
      ${esc(title(c))}${c.irreversible ? '<span class="w">changes records</span>' : ''}
      </button>`).join('')}`;
  $('#desk').querySelectorAll('.pick').forEach(b => b.onclick = () => {
    deskCap = caps.find(c => c.id === b.dataset.id);
    deskRun = null;
    deskForm();
  });
}

/* 2. a form from the declared parameters */
function deskForm(values) {
  const cap = deskCap, v = values || {};
  const mine = cap.params.filter(p => !DESK_SIGNON.has(p.name));
  const signon = cap.params.filter(p => DESK_SIGNON.has(p.name));
  const field = p => `<label>
      <span class="cap">${esc(DESK_CAP[p.name] || p.name.replace(/_/g, ' '))}${
        p.required ? '' : ' <span class="dim">(optional)</span>'}</span>
      <input id="f-${esc(p.name)}" name="${esc(p.name)}"
        type="${p.name === 'password' ? 'password' : 'text'}"
        value="${esc(v[p.name] || p.example || DESK_DEMO[p.name] || '')}"
        ${p.example && !DESK_SIGNON.has(p.name) ? `placeholder="e.g. ${esc(p.example)}"` : ''}>
      ${DESK_HINT[p.name] ? `<span class="hint">${esc(DESK_HINT[p.name])}</span>` : ''}
    </label>`;
  $('#desk').innerHTML = `<h2>${esc(title(cap))}</h2>
    <p class="sub">Fill this in and we will do it on MERIDIAN for you.</p>
    <div class="card">
      ${mine.map(field).join('') || '<p class="dim">Nothing to fill in.</p>'}
      ${signon.length ? `<details class="sign"><summary>Signed in as
        ${esc((signon.find(p => p.name === 'operator') || {}).example || 'operator')}
        &mdash; change</summary><div style="margin-top:12px">
        ${signon.map(field).join('')}</div></details>` : ''}
      <div class="acts" style="margin-top:16px">
        <button class="go" id="d-go">${esc(deskVerb(cap, 0))}</button>
        <button class="flat" id="d-back">Choose another task</button>
      </div>
      <p id="d-err" class="err" style="margin:12px 0 0"></p>
    </div>`;
  $('#d-back').onclick = () => { deskCap = null; deskPick(); };
  $('#d-go').onclick = deskSubmit;
}

function deskValues() {
  const a = {};
  deskCap.params.forEach(p => {
    const el = $(`#f-${p.name}`);
    a[p.name] = el ? el.value.trim() : '';
  });
  return a;
}

function deskSubmit() {
  const args = deskValues();
  const missing = deskCap.params
    .filter(p => p.required && !args[p.name])
    .map(p => DESK_CAP[p.name] || p.name);
  if (missing.length) {
    $('#d-err').textContent = `Still needed: ${missing.join(', ')}`;
    return;
  }
  // Anything that changes a record gets read back to the person first.
  deskCap.irreversible ? deskConfirm(args) : deskGo(args);
}

/* 3. one last look, for anything that cannot be undone */
function deskConfirm(args) {
  const shown = deskCap.params.filter(p => !DESK_SIGNON.has(p.name) && args[p.name]);
  $('#desk').innerHTML = `<h2>Check this before we do it</h2>
    <p class="sub">This changes records on MERIDIAN and cannot be undone.</p>
    <div class="card">
      ${shown.map(p => `<div class="row"><span class="dim">${
        esc(DESK_CAP[p.name] || p.name)}</span><br><b>${esc(args[p.name])}</b></div>`).join('')}
      <div class="acts" style="margin-top:18px">
        <button class="go" id="d-yes">${esc(deskVerb(deskCap, 0))}</button>
        <button class="flat" id="d-no">Go back</button>
      </div>
    </div>`;
  $('#d-no').onclick = () => deskForm(args);
  $('#d-yes').onclick = () => deskGo(args);
}

/* 4. run it, and say what is happening while it does */
async function deskGo(args) {
  if (deskBusy) return;
  deskBusy = true;
  const cap = deskCap, t0 = Date.now();
  $('#desk').innerHTML = `<h2>${esc(title(cap))}</h2>
    <p class="sub">Working on it. This usually takes a few seconds.</p>
    <div class="banner wait"><b id="d-now">Starting…</b>
      <span class="dim" id="d-el"></span></div>
    <div class="live" id="d-log"></div>`;
  const body = { args, wait_seconds: 0, operator: true };
  // The person already confirmed on the previous screen; this carries that
  // through, bound to these exact values.
  if (cap.irreversible)
    body.confirm = { capability: cap.id, args_digest: await digest(args) };

  let started;
  try {
    started = await j(`/capabilities/${encodeURIComponent(cap.id)}/invocations`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body) });
  } catch (e) {
    deskBusy = false;
    return deskFail(null, 'We could not reach the service.');
  }
  if (started.error) { deskBusy = false; return deskFail(null, started.error); }
  deskRun = started.run_id;
  const tick = setInterval(() => {
    const el = $('#d-el');
    if (el) el.textContent = `${((Date.now() - t0) / 1000).toFixed(0)}s`;
  }, 500);
  const done = await deskPoll(deskRun);
  clearInterval(tick);
  deskBusy = false;
  if (done) deskDone(done);
}

async function deskPoll(runId) {
  const said = new Set();
  for (;;) {
    await sleep(700);
    if (deskRun !== runId || !$('#desk')) return null;
    const run = await j(`/invocations/${runId}`).catch(() => null);
    if (!run) continue;
    if (run.status === 'completed') return run;
    if (run.status === 'awaiting_operator' && run.pending) { deskWait(runId, run.pending); continue; }
    if (!$('#d-log')) continue;                      // the approval screen is up
    const ev = await j(`/invocations/${runId}/events`).catch(() => null);
    if (!ev) continue;
    for (const e of ev.events.filter(x => x.event === 'step')) {
      const line = deskLine(e);
      if (!line || said.has(e.index)) continue;
      said.add(e.index);
      $('#d-log').insertAdjacentHTML('beforeend', `<div>${esc(line)}</div>`);
      $('#d-log').scrollTop = $('#d-log').scrollHeight;
      if ($('#d-now')) $('#d-now').textContent = line;
    }
  }
}

/* Plain language for one step. Deliberately says what a person watching the
   screen would say, and never how the control was found. */
function deskLine(s) {
  const m = s.resolved_by && /^\w+ "(.*)"$/.exec(s.resolved_by.value || '');
  const named = m ? m[1] : null;
  const p = (s.text || '').replace(/^\{(.+)\}$/, (_, n) => DESK_CAP[n] || n);
  if (s.action === 'navigate') return 'Opening MERIDIAN';
  if (s.action === 'type' || s.action === 'select') return `Filling in ${p || 'a field'}`;
  if (s.action === 'click') return named ? `${named}` : 'Working';
  if (s.action === 'read') return 'Reading the answer';
  return null;
}

/* 5b. somebody has to say yes */
function deskWait(runId, pending) {
  if ($('#d-ok')) return;
  // Only one kind of stop is this person's to answer: whether they authorize
  // the write they asked for. Every other kind means the screen is not what the
  // recording expected, and the person who filled in this form is not looking
  // at that browser and cannot fix it. Offering them Approve would be asking
  // them to wave through something they cannot see, and it would only retry and
  // fail again. Let it go, and tell them plainly.
  if (pending.reason !== 'approval_required') {
    j(`/invocations/${runId}/decision`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ decision: 'abort', note: 'nobody at this screen to fix it' }) });
    return;
  }
  $('#desk').innerHTML = `<h2>Waiting for approval</h2>
    <p class="sub">This needs a person to say yes before it goes through.</p>
    <div class="banner wait"><b>${esc(DESK_WHY[pending.reason] || DESK_WHY._)}</b>
      Nothing has been changed yet.</div>
    <div class="card">
      <div class="acts">
        <button class="go" id="d-ok">Approve</button>
        <button class="flat" id="d-cancel">Cancel</button>
      </div>
      <p class="dim" style="margin:12px 0 0">If nobody answers, this cancels itself
        and nothing is changed.</p>
    </div>`;
  const answer = d => {
    $('#desk').innerHTML = `<h2>${esc(title(deskCap))}</h2>
      <div class="banner wait"><b>${d === 'resume' ? 'Approved. Finishing…' : 'Cancelling…'}</b></div>
      <div class="live" id="d-log"></div>`;
    j(`/invocations/${runId}/decision`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ decision: d, note: 'answered by the requester' }) });
  };
  $('#d-ok').onclick = () => answer('resume');
  $('#d-cancel').onclick = () => answer('abort');
}

/* 6 & 7. the answer, with the application's "no" kept apart from a breakage */
function deskDone(run) {
  const res = run.result || {};
  const outs = Object.entries(res.outputs || {});
  if (res.outcome === 'success') {
    $('#desk').innerHTML = `<h2>${esc(deskVerb(deskCap, 1))}</h2>
      <div class="card">
        ${outs.length ? outs.map(([k, v]) => `<div class="row">
            <span class="dim">${esc(OUT[k] || k.replace(/_/g, ' '))}</span>
            <div class="val">${esc(v)}</div></div>`).join('')
          : '<p>Done.</p>'}
      </div>
      <div class="banner ok" style="margin-top:16px"><b>Completed successfully</b>
        MERIDIAN accepted it.</div>
      ${deskAgain()}`;
  } else if (res.outcome === 'business_outcome') {
    // Not a fault. The application considered the request and said no.
    $('#desk').innerHTML = `<h2>MERIDIAN answered</h2>
      <div class="banner said"><b>${esc(res.message || 'The request was declined.')}</b>
        This is the system's answer, not a fault. Nothing was changed.</div>
      ${deskAgain()}`;
  } else {
    // MERIDIAN says nothing when it rejects a sign-on -- it re-draws the empty
    // form. So the only signal is which screen the run was looking at when it
    // gave up, which the result already carries. A business rule cannot do this
    // job: the same words are on the first screen of every run, so the rule
    // would fire before anything had happened.
    const stuck = /OPERATOR SIGN ON|NOT SIGNED ON/i.test(res.observed || '');
    deskFail(run.run_id, res.message || run.error || '', stuck);
  }
}

function deskFail(runId, detail, signon) {
  const closed = /closed|nobody answered|declined/i.test(detail || '');
  const head = signon ? 'Those sign-on details were not accepted.'
    : closed ? 'The request was cancelled before anything changed.'
    : 'Something went wrong partway through.';
  $('#desk').innerHTML = `<h2>We could not finish that</h2>
    <div class="banner bad"><b>${esc(head)}</b>
      ${signon ? 'Open <i>Signed in as</i> and check the operator ID and password.'
               : 'Nothing was changed. You can try again.'}</div>
    ${runId ? `<p class="dim">If you need to report this, the reference is
      <b>${esc(runId)}</b>.</p>` : ''}
    ${deskAgain()}`;
}

function deskAgain() {
  setTimeout(() => {
    if ($('#d-more')) $('#d-more').onclick = () => deskForm();
    if ($('#d-new')) $('#d-new').onclick = () => { deskCap = null; deskPick(); };
  }, 0);
  return `<div class="acts" style="margin-top:18px">
    <button class="flat" id="d-more">Do this again</button>
    <button class="flat" id="d-new">Another task</button></div>`;
}

/* ------------------------------ what it wrote ----------------------------- */
async function artifact() {
  const live = caps.filter(c => c.id.startsWith('meridian_'));
  const pick = chosen && chosen.id.startsWith('meridian_') ? chosen : live[0];
  $('#body').innerHTML = `
    <h1>Artifact</h1>
    <p><select class="fld" id="which" style="width:auto">
      ${live.map(c => `<option value="${esc(c.id)}" ${c.id===pick.id?'selected':''}>
        ${esc(title(c))} — ${esc(c.id)}</option>`).join('')}
    </select></p>
    <div id="art"><p class="dim">Loading…</p></div>`;
  $('#which').onchange = e => paint(e.target.value);
  paint(pick.id);
}

async function paint(id) {
  const a = await j(`/capabilities/${encodeURIComponent(id)}/artifact`);
  $('#art').innerHTML = `
    <table class="grid"><tr><th colspan="2">Contract</th></tr>
      <tr><td class="lbl" width="130">Recorded by</td><td>${esc(a.recorded_by)}</td></tr>
      <tr><td class="lbl">Takes</td><td>${a.params.map(p=>esc(p.name)+':'+p.type).join(', ')||'—'}</td></tr>
      <tr><td class="lbl">Gives back</td><td>${a.outputs.map(o=>esc(o.name)+':'+o.type).join(', ')||'—'}</td></tr>
      <tr><td class="lbl">Approved</td><td>${a.approved?'<span class="ok">yes</span>':'<span class="err">draft</span>'}</td></tr>
    </table>
    <h2>Steps</h2>
    <table class="grid"><tr><th>#</th><th>Action</th><th>How it finds the control</th><th>Risk</th></tr>
    ${a.steps.map(s => { const t = s.target && s.target.candidates[0];
      const h = t ? HOW[t.strategy] : null;
      return `<tr><td class="dim">${s.index}</td>
        <td>${esc(s.action)}${s.text?' <span class="dim">'+esc(s.text)+'</span>':''}</td>
        <td>${t ? `<span class="tag${h&&h[1]?'':' w'}">${esc(h?h[0]:t.strategy)}</span>
             <span class="dim">${esc(t.value).slice(0,46)}</span>` : ''}</td>
        <td>${s.risk==='irreversible'?'<span class="err">writes</span>':'<span class="dim">'+s.risk+'</span>'}</td>
      </tr>`; }).join('')}</table>
    <h2>The file itself</h2>
    <pre>${esc(JSON.stringify(a, null, 2))}</pre>`;
}

/* ---------------------------------- runs ---------------------------------- */
async function runs() {
  const { invocations } = await j('/invocations');
  $('#body').innerHTML = `
    <h1>Runs</h1>
    <table class="grid"><tr><th>Job</th><th>Result</th><th>Time</th></tr>
    ${invocations.slice(0,25).map(r => {
      const st = r.outcome || r.status, v = VERDICT[st] || ['dim', st];
      const c = caps.find(x => x.id === r.capability);
      return `<tr class="pick" data-run="${esc(r.run_id)}">
        <td class="lbl">${esc(c?title(c):r.capability)}</td>
        <td class="${v[0]}">${v[1]}${r.business_code?' · '+esc(r.business_code):''}</td>
        <td class="dim">${r.run_id.slice(9,15).replace(/(\d\d)(\d\d)(\d\d)/,'$1:$2:$3')}</td></tr>`;
    }).join('')}</table>`;
  $('#body').querySelectorAll('tr.pick').forEach(tr => tr.onclick = () => show(tr.dataset.run));
}

async function show(id) {
  document.querySelectorAll('#tabs button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.tab === 'runs'));
  const [r, ev] = await Promise.all([j(`/invocations/${id}`), j(`/invocations/${id}/events`)]);
  const res = r.result || {}, st = res.outcome || (r.error ? 'failure' : r.status);
  const v = VERDICT[st] || ['dim', st];
  const c = caps.find(x => x.id === r.capability);
  const outs = res.outputs || {};
  const steps = ev.events.filter(e => e.event === 'step');
  $('#body').innerHTML = `
    <h1>${esc(c ? title(c) : r.capability || '')}</h1>
    <div class="box" style="margin-top:8px"><span class="${v[0]}">${v[1]}</span>
      ${res.business_code ? ' — ' + esc(res.business_code) : ''}
      ${res.message ? '<br><span class="dim">'+esc(res.message)+'</span>' : ''}
      ${r.error ? '<br><span class="err">'+esc(r.error)+'</span>' : ''}</div>
    ${Object.keys(outs).length ? `<h2>Result</h2><table class="grid">
      ${Object.entries(outs).map(([k,val]) => `<tr><td class="lbl" width="150">${esc(OUT[k]||k)}</td>
      <td>${esc(val)}</td></tr>`).join('')}</table>` : ''}
    ${(res.degraded||[]).length ? `<h2>Drift</h2>
      <table class="grid">
      ${res.degraded.map(d => `<tr><td width="70">Step ${d.step}</td><td>expected
        ${esc((HOW[d.primary]||[d.primary])[0])}, found
        <span class="warn">${esc((HOW[d.won_by]||[d.won_by])[0])}</span></td></tr>`).join('')}
      </table>` : ''}
    <h2>Steps</h2>
    <table class="grid">${steps.map(s => { const h = s.resolved_by ? HOW[s.resolved_by.strategy] : null;
      return `<tr><td width="26" class="dim">${s.index}</td><td>${esc(said(s))}</td>
        <td width="165">${h?`<span class="tag${h[1]?'':' w'}">${esc(h[0])}</span>`:''}</td>
        <td width="58" class="dim" align="right">${s.duration_ms!=null?s.duration_ms+' ms':''}</td></tr>`;
    }).join('') || '<tr><td class="dim">No steps recorded.</td></tr>'}</table>
    <p style="margin-top:13px"><button class="btn" onclick="go('runs')">Back</button></p>`;
}

const short = d => (d || '')
  .replace(/ captioned .*/, '')
  .replace(/^typed into \w+/, 'typed a value')
  .replace(/^clicked (link|button) /, 'clicked ')
  .replace(/^selected '(.+?)' in \w+/, "chose $1")
  .replace(/^read (\w+) = /, '$1 = ');

function said(s) {
  const m = s.resolved_by && /^\w+ "(.*)"$/.exec(s.resolved_by.value || '');
  const named = m ? '“' + m[1] + '”' : 'a control';
  const p = (s.text || '').replace(/^\{(.+)\}$/, (_, n) => FIELD[n] || n);
  return s.action === 'navigate' ? `Opened ${(s.url||'').replace(/^https?:\/\/[^/]+/,'') || 'the application'}`
    : s.action === 'type' ? `Entered ${p}` : s.action === 'select' ? `Chose ${p}`
    : s.action === 'click' ? `Clicked ${named}`
    : s.action === 'read' ? `Read ${s.read ? '“' + s.read + '”' : 'a value'}`
    : 'Waited';
}

j('/capabilities').then(d => {
  caps = d.capabilities;
  $('#conn').textContent = `${caps.length} capabilities`;
  about();
});
</script>
